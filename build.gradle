buildscript {
    ext {
        vXnat = "1.11.0-SNAPSHOT"   // jakarta / Tomcat 10 line
    }
}

plugins {
    id "eclipse"
    id "groovy"
    id "idea"
    id "java-library"
    id "maven-publish"
    id "com.dorongold.task-tree" version "1.5"
    id "com.palantir.git-version" version "3.0.0"
    id "io.franzbecker.gradle-lombok" version "5.0.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "org.nrg.xnat.build.xnat-data-builder" version "${vXnat}"
}

group "org.nrg.xnatx.plugins"
version "0.9.0-SNAPSHOT"
description "XNAT Batch Launch Plugin"

repositories {
    // Scope mavenLocal to org.nrg.* so a locally-published SNAPSHOT of core is consumed without shadowing
    // partial third-party artifacts (e.g. ehcache-*-jakarta classifiers). See migration guide.
    mavenLocal { content { includeGroupByRegex 'org\\.nrg.*' } }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-release" }
    maven { url "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot" }
    mavenCentral()
}

configurations {
    // Gradle 9 forbids mutating a configuration's excludes after it has been resolved (the old
    // `all { exclude }` form triggers this). Apply excludes lazily per-configuration instead.
    configureEach {
        exclude group: "javax.sql"
        exclude group: "javax.transaction"
        exclude group: "javax.jms"
    }
    implementAndInclude
    implementation.extendsFrom(implementAndInclude)
}

dependencyManagement.imports {
    mavenBom "org.nrg:parent:${vXnat}"
}

dependencies {
    // XNAT host API + Turbine 7 / Velocity 2 (provided by XNAT at runtime).
    compileOnly "org.nrg.xnat:web"
    compileOnly "org.nrg.xdat:core"
    compileOnly "org.nrg:framework"
    // 1.11.0 coordinate renames: turbine:turbine -> org.apache.turbine:turbine (7.0),
    // org.apache.velocity:velocity -> org.apache.velocity:velocity-engine-core (2.4.1)
    compileOnly "org.apache.turbine:turbine"
    compileOnly "org.apache.velocity:velocity-engine-core"

    // org.nrg.action.ClientException exposes org.restlet.data.Status in its API (Status.CLIENT_ERROR_*),
    // so restlet must be on the compile classpath. 2.6 keeps the standard HTTP statuses used here.
    compileOnly "org.restlet:org.restlet"

    // springfox is dead on Spring 6; the xapi controller only uses io.swagger.annotations.* -> provide those directly.
    compileOnly "io.swagger:swagger-annotations:1.5.20"

    // batch-launch drives container-service (WorkflowService/Workflow reference its API). Provided at runtime.
    compileOnly "org.nrg.xnatx.plugins:container-service:3.9.0-SNAPSHOT:fat"

    compileOnly "org.springframework:spring-web"
    compileOnly "org.springframework:spring-webmvc"
    compileOnly "org.springframework:spring-context"
    compileOnly "org.springframework:spring-beans"

    compileOnly "jakarta.servlet:jakarta.servlet-api"
    compileOnly "com.google.code.findbugs:jsr305"        // javax.annotation.Nonnull/Nullable (JSR-305, stays javax)
    compileOnly "org.apache.commons:commons-lang3"
    compileOnly "com.google.guava:guava"
    compileOnly "com.fasterxml.jackson.core:jackson-annotations"
    compileOnly "com.fasterxml.jackson.core:jackson-databind"
    compileOnly "org.slf4j:slf4j-api"
}

// Pulls in the Jenkins BUILD_NUMBER environment variable if available.
def buildDate = new Date()
def buildNumber = System.getenv().BUILD_NUMBER?.toInteger() ?: "Manual"
def isDirty, branchName, gitHash, gitHashFull, commitDistance, lastTag, isCleanTag

try {
    def gitDetails = versionDetails()
    isDirty = gitVersion().endsWith ".dirty"
    branchName = gitDetails.branchName ?: "Unknown"
    gitHash = gitDetails.gitHash
    gitHashFull = gitDetails.gitHashFull
    commitDistance = gitDetails.commitDistance
    lastTag = gitDetails.lastTag
    isCleanTag = gitDetails.isCleanTag
} catch (IllegalArgumentException e) {
    logger.info "Got an error trying to read VCS metadata from git. It's possible this project is not under VCS control. Using placeholder values for manifest entries."
    isDirty = true
    branchName = "Unknown"
    gitHash = "None"
    gitHashFull = "None"
    commitDistance = 0
    lastTag = "None"
    isCleanTag = false
}

ext.gitManifestAttrs = [
        "Application-Name"        : project.description,
        "Build-Date"              : buildDate,
        "Build-Number"            : buildNumber,
        "Implementation-Version"  : project.version,
        "Implementation-Sha"      : gitHash,
        "Implementation-Sha-Full" : gitHashFull,
        "Implementation-Commit"   : commitDistance,
        "Implementation-LastTag"  : lastTag,
        "Implementation-Branch"   : branchName,
        "Implementation-CleanTag" : isCleanTag,
        "Implementation-Dirty"    : isDirty
]

logger.info """
Building artifacts with manifest attributes:

 * Build-Date:              ${buildDate}
 * Build-Number:            ${buildNumber}
 * Implementation-Version:  ${version}
 * Implementation-Sha-Full: ${gitHashFull}
 * Implementation-Sha:      ${gitHash}
 * Implementation-Commit:   ${commitDistance}
 * Implementation-LastTag:  ${lastTag}
 * Implementation-Branch:   ${branchName}
 * Implementation-CleanTag: ${isCleanTag}
 * Implementation-Dirty:    ${isDirty}
"""

java {
    // toolchain (not sourceCompatibility) so compile runs on JDK 21 regardless of the daemon JDK —
    // matches container-service/mfa and keeps Lombok 1.18.34's javac hooks working. See migration guide.
    toolchain { languageVersion = JavaLanguageVersion.of(21) }

    manifest {
        attributes gitManifestAttrs
    }

    withSourcesJar()
    withJavadocJar()
}

compileJava {
    dependsOn xnatDataBuilder
    options.fork = true   // a cross-JDK toolchain (21) must fork; also lets Lombok 1.18.34 run on JDK 21
}

lombok {
    version = "1.18.34"
    sha256 = "1ea5ad6c6afcff902d75072b2aaa6695585aebee9f12127e15c0036ba95d2918"
}

task xnatPluginJar(type: Jar) {
    dependsOn sourcesJar, javadocJar
    zip64 true
    archiveClassifier.set "xpl"
    manifest {
        attributes gitManifestAttrs
    }
    // files and folders with "-dev" or "--xx" in their name
    // will not be in the compiled jar
    exclude "**/resources/**/*-dev**"
    exclude "**/resources/**/*--xx**"
    from {
        configurations.implementAndInclude.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    with jar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifacts {
                artifact sourcesJar
                artifact javadocJar
                artifact xnatPluginJar
            }

            pom.withXml {
                def root = asNode()
                root.appendNode("name", "XNAT Batch Launch Plugin")
                root.appendNode("url", "https://bitbucket.org/xnatx/xnatx-batch-launch-plugin")
                root.appendNode("inceptionYear", "2019")

                root.appendNode("scm").with {
                    appendNode("url", "https://bitbucket.org/xnatx/xnatx-batch-launch-plugin")
                    appendNode("connection", "scm:https://bitbucket.org/xnatx/xnatx-batch-launch-plugin")
                    appendNode("developerConnection", "scm:git@bitbucket.org:xnatx/xnatx-batch-launch-plugin.git")
                }

                root.appendNode("licenses").appendNode("license").with {
                    appendNode("name", "Simplified BSD 2-Clause License")
                    appendNode("url", "https://xnat.org/about/license.php")
                    appendNode("distribution", "repo")
                }

                root.appendNode("developers").with {
                    appendNode("developer").with {
                        appendNode("id", "mohana")
                        appendNode("name", "Mohana Ramaratnam")
                        appendNode("email", "mohana@radiologics.com")
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = "XNAT_Artifactory"
            url = project.version.toString().endsWith("-SNAPSHOT")
                ? "https://nrgxnat.jfrog.io/nrgxnat/libs-snapshot-local"
                : "https://nrgxnat.jfrog.io/nrgxnat/libs-release-local"
            // CI injects ORG_GRADLE_PROJECT_artifactoryUser/Token env vars (Gradle maps
            // these to project properties). Local devs can set artifactoryUser/Token in
            // ~/.gradle/gradle.properties. Mirrors monorepo's buildSrc convention.
            credentials {
                username = (project.findProperty("artifactoryUser")  ?: System.getenv("ARTIFACTORY_USER"))  ?: ""
                password = (project.findProperty("artifactoryToken") ?: System.getenv("ARTIFACTORY_TOKEN")) ?: ""
            }
        }
    }
}

def propertyWithDefault(String name, Object value) {
    hasProperty(name) ? property(name) : value
}
